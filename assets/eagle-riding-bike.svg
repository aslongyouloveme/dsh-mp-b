<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">老鹰骑自行车 · Eagle on a bicycle</title>
  <desc id="desc">一只白头、棕色羽毛的老鹰握着车把，黄色爪子踩着踏板，骑着一辆青绿色自行车穿过晴朗的山间小路。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#eaf7fb"/>
      <stop offset="1" stop-color="#fff8e7"/>
    </linearGradient>
    <linearGradient id="wing" x2="1" y2="1">
      <stop stop-color="#956347"/>
      <stop offset="1" stop-color="#523b32"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" rx="40" fill="url(#sky)"/>
  <circle cx="756" cy="150" r="59" fill="#ffd16b"/>
